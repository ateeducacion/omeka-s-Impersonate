services:

  omekas:
    image: erseco/alpine-omeka-s:4.2
    restart: unless-stopped
    depends_on:
      - mariadb
    # Use another host port to avoid clash with Moodle (both expose 8080 internally)
    ports:
      - "8080:8080"
    environment:
      # DB (separate database & user)
      DB_HOST: mariadb
      DB_NAME: omeka
      DB_USER: omeka
      DB_PASSWORD: omeka
      DB_PORT: 3306

      # Core install. The container ignores the blueprint's `install`, so keep
      # these in line with blueprint.json (an existing admin is never changed).
      OMEKA_ADMIN_EMAIL: admin@example.com
      OMEKA_ADMIN_NAME: admin
      OMEKA_ADMIN_PASSWORD: password
      OMEKA_SITE_TITLE: "Impersonate Playground"
      OMEKA_LOCALE: es
      OMEKA_TIMEZONE: Atlantic/Canary

      # The same blueprint.json as Omeka S Playground (the five test users, this
      # module, the demo site, settings), re-applied on every start. x-playground is ignored.
      OMEKA_BLUEPRINT: /var/www/html/volume/modules/Impersonate/blueprint.json
      # Keep the stack up if the blueprint fails (e.g. no network), instead of a restart loop
      OMEKA_BLUEPRINT_ON_ERROR: warn

      # Optional but recommended so CLI jobs build correct URLs
      SITE_URL: http://localhost:8080
      APPLICATION_ENV: development

      # Dev tools only: the module and the test users come from the blueprint
      OMEKA_THEMES: "default"
      OMEKA_MODULES: |
        Common
        Log
        EasyAdmin
        Adminer

      # Auto-import sample data on first boot
      OMEKA_CSV_IMPORT_FILE: /data/sample_data.csv

    volumes:
      - omekas_data:/var/www/html/volume:Z
      - ./data:/data:ro
      - ./:/var/www/html/volume/modules/Impersonate

  mariadb:
    image: mariadb:latest
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: omeka
      MYSQL_DATABASE: omeka
      MYSQL_USER: omeka
      MYSQL_PASSWORD: omeka

volumes:
  mariadb_data:
  omekas_data:

